<!-- templates/add_expense.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Add Business Expense</title>
    <!-- Link to CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>💰 Add a New Business Expense</h1>
        
        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-message {{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <div class="nav-links">
            <a href="/">🏠 Home</a>
            <a href="/expenses">📊 View All Expenses</a>
        </div>
        
        <form action="/submit_expense" method="POST">
            <div class="form-group">
                <label for="date">📅 Date:</label>
                <input type="date" id="date" name="date" required>
            </div>
            
            <div class="form-group">
                <label for="person">👤 Employee Name:</label>
                <input type="text" id="person" name="person" placeholder="e.g., John Doe" required>
            </div>
            
            <div class="form-group">
                <label for="amount">💰 Amount (in R):</label>
                <input type="number" id="amount" name="amount" step="0.01" placeholder="0.00" required>
            </div>
            
            <div class="form-group">
                <label for="category">📂 Category:</label>
                <select id="category" name="category" required>
                    <option value="Food">🍔 Food</option>
                    <option value="Transport">🚗 Transport</option>
                    <option value="Office Supplies">📎 Office Supplies</option>
                    <option value="Software">💻 Software</option>
                    <option value="Other">📦 Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="description">📝 Description:</label>
                <textarea id="description" name="description" rows="3" placeholder="What was this expense for?"></textarea>
            </div>
            
            <div class="form-group">
                <label for="approval_notes">📋 Notes for Manager:</label>
                <textarea id="approval_notes" name="approval_notes" rows="2" placeholder="Any additional context for approval..."></textarea>
            </div>
            
            <div class="form-group">
                <button type="submit" class="btn btn-success">💾 Save Expense</button>
                <a href="/" class="btn btn-secondary">❌ Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
